# Production profile (PostgreSQL)
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fanatics}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:fanatics}
    password: ${DB_PASSWORD:fanatics}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

logging:
  level:
    com.github.dziki.fanatics: INFO
    org.springframework.kafka: WARN
